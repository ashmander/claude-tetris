<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="records.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar modo claro/oscuro" title="Alternar modo claro/oscuro">🌙</button>
    </div>
    <div class="stage">
      <div class="game-container">
        <canvas id="board" width="300" height="600"></canvas>

        <aside class="panel">
          <div class="panel-section">
            <span class="label">SCORE</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>

          <div class="panel-section">
            <span class="label">NEXT</span>
            <canvas id="next-canvas" width="120" height="120"></canvas>
          </div>

          <div class="panel-section controls">
            <span class="label">CONTROLS</span>
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> pausa</li>
            </ul>
          </div>
        </aside>
      </div>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <button id="restart-btn">Reiniciar</button>

          <div id="gameover-records">
            <span class="records-section-title">TOP 5</span>
            <div id="gameover-records-table"></div>
            <div id="gameover-best-stats" class="best-stats"></div>
            <div id="save-record-form" class="hidden">
              <input id="record-name-input" type="text" maxlength="12" placeholder="Tu nombre" />
              <button id="save-record-btn" type="button">Guardar</button>
            </div>
            <button class="reset-records-btn" type="button">Resetear récords</button>
          </div>
        </div>
      </div>

      <div id="start-screen" class="overlay">
        <div class="start-box">
          <p class="start-title">TETRIS</p>
          <span class="records-section-title">TOP 5</span>
          <div id="start-records-table"></div>
          <div id="start-best-stats" class="best-stats"></div>
          <div class="start-actions">
            <button id="play-btn" type="button">JUGAR</button>
            <button class="reset-records-btn" type="button">Resetear récords</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="records.js"></script>
  <script src="game.js"></script>
</body>
</html>
