name: Format Issues

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: issue-format-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  format-issue:
    if: >-
      !endsWith(github.event.sender.login, '[bot]') &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh api:*),Bash(gh label list:*),Read,Glob,Grep"'
          prompt: |
            Estás formateando el issue #${{ github.event.issue.number }} del repositorio ${{ github.repository }}.

            1. Lee el issue completo:
               gh issue view ${{ github.event.issue.number }} --json title,body,labels,author

            2. Lee las labels disponibles en el repo:
               gh label list
               Solo puedes usar labels de ese listado. No crees labels nuevas.

            3. Si hace falta contexto para clasificar el issue (por ejemplo distinguir un bug de
               una petición de feature), consulta CLAUDE.md y game.js en este repo.

            4. Reescribe el body del issue con esta plantilla en Markdown. Omite las secciones
               que queden vacías; no las rellenes con placeholders ni inventes contenido que el
               autor no escribió:

               <!-- claude-format:v1 -->

               ## Resumen
               Una o dos frases.

               ## Contexto
               Qué parte del juego afecta (tablero, piezas, scoring, render, controles).

               ## Pasos para reproducir
               1. ...

               ## Comportamiento esperado vs. actual

               ## Criterios de aceptación
               - [ ] ...

               <details>
               <summary>Texto original del autor</summary>

               ...texto crudo tal cual, sin modificar...

               </details>

            5. Reglas:
               - Mantén el idioma del autor (por defecto español).
               - No inventes pasos de reproducción, criterios de aceptación ni detalles técnicos
                 que el autor no haya escrito.
               - Si el body ya empieza con el marcador "<!-- claude-format:v1 -->", ya tiene el
                 texto original preservado en el <details> existente: reutilízalo tal cual, no lo
                 anides ni lo dupliques. Re-formatea el resto del contenido a partir de lo que el
                 autor haya editado.
               - No modifiques el título salvo que esté vacío o sea puramente ruido.
               - Si el body ya cumple el formato y las labels ya son correctas, no hagas ningún
                 cambio (no llames a gh issue edit).
               - El diagnóstico técnico (pasos 8-10) NUNCA entra en el body del issue; vive
                 solo en el comentario aparte descrito abajo.

            6. Aplica el body actualizado:
               gh issue edit ${{ github.event.issue.number }} --body "<nuevo body>"

            7. Reconcilia las labels según el contenido del issue: agrega con --add-label las que
               falten y quita con --remove-label las que ya no apliquen, usando solo las labels
               del paso 2. No toques labels que no formen parte de ese set semántico (por ejemplo
               labels de proceso puestas manualmente).
               gh issue edit ${{ github.event.issue.number }} --add-label "..." --remove-label "..."

            8. Diagnóstico técnico — investiga antes de escribirlo:
               - Lee CLAUDE.md y game.js completo (son ~300 líneas, caben enteros) para entender
                 la arquitectura (colisión, wall kicks, ciclo lockPiece → merge → clearLines →
                 spawn, curva de velocidad). Si el issue toca render o layout, revisa también
                 index.html y style.css.
               - Usa Grep para localizar la función o sección exacta implicada en el problema
                 descrito por el autor.
               - Si el issue es una petición de feature sin defecto concreto, o no hay evidencia
                 suficiente en el código para señalar una causa, omite el diagnóstico por completo:
                 no publiques comentario, no inventes contenido de relleno. Pasa directo a haber
                 terminado (no ejecutes los pasos 9-10).

            9. Si hay diagnóstico, redáctalo en español (o el idioma del autor) con este formato
               exacto, dejando el marcador HTML en la primera línea:

               <!-- claude-diagnosis:v1 -->
               ## Diagnóstico técnico

               **Causa raíz probable** (hipótesis, sin verificar en ejecución)
               Dónde vive el problema, con referencias `archivo:función` — p. ej. `game.js:collide`.

               **Confianza:** alta | media | baja — y qué haría falta para subirla.

               **Riesgos**
               Qué se puede romper al tocar esa zona del código.

               **Esfuerzo estimado:** trivial | pequeño | mediano | grande.

               ---
               *Diagnóstico automático. Hipótesis, no verificado en ejecución.*

               Reglas para este comentario:
               - No propongas parches ni escribas código; el objetivo es triar, no arreglar.
               - No inventes causas ni archivos que no hayas verificado leyendo el código.

            10. Publica el diagnóstico de forma idempotente (nunca crees un segundo comentario de
                diagnóstico; si ya existe uno vigente y sigue siendo válido tras una edición del
                autor, no lo reescribas):
               a. Escribe el texto del paso 9 a un archivo temporal (evita problemas de escaping
                  de markdown multilínea en la shell).
               b. Busca un comentario existente con el marcador:
                  gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments --jq '.[] | select(.body | startswith("<!-- claude-diagnosis:v1 -->")) | .id'
               c. Si existe un id, actualízalo en su sitio:
                  gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -f body=@<archivo>
               d. Si no existe, crea el comentario:
                  gh issue comment ${{ github.event.issue.number }} --body-file <archivo>
